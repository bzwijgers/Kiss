name: android
on:
  workflow_dispatch:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
permissions:
  contents: write
concurrency:
  group: android
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Bouw APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Zet APK op de website
        run: |
          # Start from the newest main (an earlier build may have added an APK meanwhile), then put this APK on top.
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/kiss-collection.apk"
          git fetch -q origin main && git checkout -q -B main origin/main
          cp "$RUNNER_TEMP/kiss-collection.apk" kiss-collection.apk
          git config user.name "kiss-collection-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f kiss-collection.apk
          git diff --cached --quiet || git commit -m "APK bijgewerkt"
          git push origin main
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: kiss-collection.apk }
