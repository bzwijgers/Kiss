<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kiss Collection</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kiss Collection">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<style>
  html, body { min-height: 100%; margin: 0; background: #000; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px 16px max(24px, env(safe-area-inset-bottom)); box-sizing: border-box; text-align: center; min-height: 100vh; }
  img { width: min(70vw, 360px); height: auto; }
  h1 { margin: 0; letter-spacing: 0.16em; text-transform: uppercase; font-size: 15px; font-weight: 600; }
  .btn { display: inline-block; min-width: 220px; color: #fff; background: #C8102E; border: 0; border-radius: 999px; padding: 14px 22px; text-decoration: none; font: 600 14px system-ui, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
  .btn.ghost { background: transparent; border: 1px solid rgba(255, 255, 255, 0.6); }
  .help { max-width: 340px; font-size: 14px; line-height: 1.5; color: #ccc; margin: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<!-- Home-screen launcher for Barry's Kiss collection. The collection itself lives on claude.ai; this page gives it an app icon and opens it. -->
<img src="img/splash.jpg" alt="Kiss">
<h1>Barry's Collection</h1>
<button type="button" class="btn" id="install" hidden>App installeren</button>
<p class="help" id="help">Zet de app op je beginscherm: tik in Chrome op de drie puntjes rechtsboven en kies <b>App installeren</b> of <b>Toevoegen aan startscherm</b>.</p>
<a class="btn ghost" id="go" href="https://claude.ai/artifact/5ezkixSFRAaSSJiygRLam7">Collectie openen</a>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  var standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  var go = document.getElementById('go');
  if (standalone) {
    // Opened from the home-screen icon: go straight to the collection.
    document.getElementById('help').hidden = true;
    setTimeout(function () { location.replace(go.href); }, 400);
  }
  var deferred = null, btn = document.getElementById('install');
  addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferred = e; btn.hidden = false;
    document.getElementById('help').textContent = 'Tik op App installeren om het KISS-icoon op je beginscherm te zetten.';
  });
  btn.addEventListener('click', function () {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.finally(function () { deferred = null; btn.hidden = true; });
  });
  addEventListener('appinstalled', function () {
    btn.hidden = true;
    document.getElementById('help').textContent = 'Geïnstalleerd. Open de app voortaan met het KISS-icoon op je beginscherm.';
  });
</script>
</body>
</html>
